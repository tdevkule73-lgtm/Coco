<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Ozz - Hum. Train. Discover.</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d17;--card:rgba(22,26,46,.7);--muted:#94a3b8;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',sans-serif}
body{background:var(--bg);color:#f8fafc;min-height:100vh;padding:30px 20px;display:flex;justify-content:center}
.container{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-size:2.2rem;font-weight:800;text-align:center;background:linear-gradient(135deg,#a855f7,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.9rem;text-align:center;margin-top:4px}
.tabs{display:flex;width:100%;padding:4px;border-radius:12px;background:rgba(255,255,255,.05)}
.tabs button{flex:1;padding:10px 4px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:600;font-size:.8rem;cursor:pointer}
.tabs button.active{background:#7c3aed;color:#fff}
#wave-btn{width:100%;height:190px;border:0;background:none;cursor:pointer}
#wave{width:100%;height:100%;display:block}
.card{width:100%;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;display:none;flex-direction:column;gap:12px}
label{font-size:.8rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number]{width:100%;margin-top:6px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);padding:10px 14px;border-radius:10px;color:#fff;font-size:.9rem}
.drop{border:2px dashed rgba(255,255,255,.2);padding:14px;border-radius:12px;text-align:center;cursor:pointer;color:var(--muted);font-size:.85rem}
.go{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;cursor:pointer}
#status{font-weight:600;color:var(--muted);text-align:center;min-height:24px}
#error{color:var(--danger);font-size:.85rem;text-align:center;display:none}
#result{flex-direction:column;align-items:center}
#coverArt{width:150px;height:150px;border-radius:14px;object-fit:cover}
.links{display:flex;gap:10px;width:100%}
.links a{flex:1;padding:10px;border-radius:10px;font-weight:700;text-decoration:none;text-align:center;font-size:.85rem}
#spotifyBtn{background:#1db954;color:#000}#youtubeBtn{background:#f00;color:#fff}
</style>
</head>
<body>
<div class="container">
  <div><h1>Music Ozz</h1><p class="sub">Hum. Train. Discover.</p></div>

  <div class="tabs">
    <button class="active" id="tabIdentify" onclick="switchTab('identify')">🎤 Hum &amp; Find</button>
    <button id="tabTrain" onclick="switchTab('train')">🎓 Train Voice</button>
    <button id="tabUpload" onclick="switchTab('upload')">➕ Add Song</button>
  </div>

  <button id="wave-btn" aria-label="Tap and hum"><canvas id="wave"></canvas></button>

  <div class="card" id="trainSection">
    <div><label>Song ID to train</label><input type="number" id="trainSongIdInput" placeholder="e.g. 100001"></div>
    <p class="sub">Hum the melody for 8 seconds to link your voice to this song.</p>
    <button class="go" id="trainRecordBtn">🔴 Record Voice Sample</button>
  </div>

  <div class="card" id="uploadSection">
    <div><label>Song title</label><input type="text" id="songTitleInput" placeholder="e.g. Tum Hi Ho"></div>
    <div><label>Artist name</label><input type="text" id="artistInput" placeholder="e.g. Arijit Singh"></div>
    <div><label>Song link (optional)</label><input type="text" id="songUrlInput" placeholder="https://..."></div>
    <div class="drop" onclick="fileInput.click()"><span id="fileNameDisplay">📁 Choose MP3 file (optional)</span>
      <input type="file" id="fileInput" accept="audio/*" hidden onchange="updateFileName()"></div>
    <button class="go" onclick="uploadSong()">Learn Song into AI Memory</button>
  </div>

  <div id="status">Tap the wave and hum</div>
  <div id="error"></div>

  <div class="card" id="result">
    <img id="coverArt" src="" alt="Album cover">
    <div style="text-align:center">
      <div style="font-size:1.2rem;font-weight:700" id="songTitle"></div>
      <div class="sub" id="songArtist"></div>
    </div>
    <div class="links">
      <a id="spotifyBtn" href="#" target="_blank" rel="noopener">Spotify</a>
      <a id="youtubeBtn" href="#" target="_blank" rel="noopener">YouTube</a>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let mediaRecorder, audioChunks = [], isRecording = false, analyser = null, audioCtx = null, buf = null;

/* Siri-style wave: always moving, grows with your voice while recording */
const cv = $('wave'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
const layers = [{c:'124,58,237', f:1.3, s:.9, a:1}, {c:'6,182,212', f:1.9, s:-1.2, a:.75}, {c:'236,72,153', f:2.6, s:1.6, a:.5}];
let level = 0, t = 0;
function resize(){ cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr; }
resize(); addEventListener('resize', resize);

function draw(){
  let target = 0;
  if (analyser){
    analyser.getByteTimeDomainData(buf);
    let sum = 0;
    for (const v of buf){ const d = (v - 128) / 128; sum += d * d; }
    target = Math.min(1, Math.sqrt(sum / buf.length) * 5);
  }
  level += (target - level) * (analyser ? .2 : .08);
  t += .02;
  const w = cv.width, h = cv.height, amp = h * (.07 + .4 * level);
  ctx.clearRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';
  for (const L of layers){
    ctx.beginPath();
    for (let x = 0; x <= w; x += 3){
      const p = x / w, env = Math.pow(Math.sin(Math.PI * p), 2);
      const y = h / 2 + (Math.sin(p * Math.PI * 2 * L.f + t * L.s * 3) + .3 * Math.sin(p * Math.PI * 5 + t * L.s * 2)) * amp * env * L.a;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.strokeStyle = `rgba(${L.c},${.9 * L.a})`;
    ctx.lineWidth = 3 * dpr;
    ctx.shadowColor = `rgb(${L.c})`;
    ctx.shadowBlur = 18 * dpr;
    ctx.stroke();
  }
  requestAnimationFrame(draw);
}
draw();

function switchTab(mode){
  ['identify','train','upload'].forEach(m => $('tab' + m[0].toUpperCase() + m.slice(1)).classList.toggle('active', m === mode));
  $('wave-btn').style.display = mode === 'identify' ? 'block' : 'none';
  $('trainSection').style.display = mode === 'train' ? 'flex' : 'none';
  $('uploadSection').style.display = mode === 'upload' ? 'flex' : 'none';
  $('result').style.display = 'none';
  $('error').style.display = 'none';
  $('status').innerText = {identify:'Tap the wave and hum', train:'Enter a Song ID and record your voice', upload:'Add a song by title and artist'}[mode];
}

$('wave-btn').addEventListener('click', () => startVoiceRecording('identify'));
$('trainRecordBtn').addEventListener('click', () => startVoiceRecording('train'));

async function startVoiceRecording(purpose){
  if (isRecording) return stopVoiceRecording();
  const songId = $('trainSongIdInput').value;
  if (purpose === 'train' && !songId) return showError('Please enter a valid Song ID first.');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    buf = new Uint8Array(analyser.fftSize);
    audioCtx.createMediaStreamSource(stream).connect(analyser);

    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => handleRecordingComplete(purpose, songId);
    mediaRecorder.start();
    isRecording = true;
    if (purpose === 'train') $('trainRecordBtn').innerText = '⏹️ Stop Recording';
    $('status').innerText = 'Listening... hum your melody now!';
    setTimeout(() => { if (isRecording) stopVoiceRecording(); }, 8000);
  } catch (err) { showError('Microphone access denied.'); }
}

function stopVoiceRecording(){
  if (!mediaRecorder || !isRecording) return;
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
  isRecording = false;
  analyser = null;
  audioCtx.close();
  $('trainRecordBtn').innerText = '🔴 Record Voice Sample';
  $('status').innerText = 'Processing with AI...';
}

async function handleRecordingComplete(purpose, songId){
  const blob = new Blob(audioChunks, {type: 'audio/webm'});
  const formData = new FormData();
  if (purpose === 'identify'){
    formData.append('file', blob, 'hum.webm');
    try {
      const data = await (await fetch('/api/v1/identify', {method: 'POST', body: formData})).json();
      if (data.matched && data.song){
        $('status').innerText = 'Match found!';
        $('coverArt').src = data.song.cover_art_url || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=400&q=80';
        $('songTitle').innerText = data.song.title;
        $('songArtist').innerText = data.song.artist;
        $('spotifyBtn').href = data.song.spotify_url || '#';
        $('youtubeBtn').href = data.song.youtube_url || '#';
        $('result').style.display = 'flex';
      } else showError('No matching song found.');
    } catch (e) { showError('Error connecting to server.'); }
  } else {
    formData.append('file', blob, 'voice_sample.webm');
    formData.append('song_id', songId);
    try {
      const res = await fetch('/api/v1/songs/enroll-hum', {method: 'POST', body: formData});
      const data = await res.json();
      res.ok ? $('status').innerText = '✅ Trained! Voice print memorized.' : showError(data.detail || 'Training failed.');
    } catch (e) { showError('Failed to train voice.'); }
  }
}

function updateFileName(){
  const f = $('fileInput').files[0];
  if (f) $('fileNameDisplay').innerText = '🎵 ' + f.name;
}

async function uploadSong(){
  const file = $('fileInput').files[0], songUrl = $('songUrlInput').value;
  const title = $('songTitleInput').value, artist = $('artistInput').value;
  if (!title) return showError('Please enter the song title.');
  const formData = new FormData();
  if (file) formData.append('file', file);
  if (songUrl) formData.append('song_url', songUrl);
  formData.append('title', title);
  formData.append('artist', artist || 'Unknown Artist');
  $('status').innerText = 'Finding audio & training AI memory...';
  try {
    const res = await fetch('/api/v1/songs/index', {method: 'POST', body: formData});
    const data = await res.json();
    res.ok ? $('status').innerText = `✅ Learned! Song ID: ${data.song_id}` : showError(data.detail || 'Failed to process song.');
  } catch (e) { showError('Upload failed. Check connection.'); }
}

function showError(msg){ $('error').innerText = msg; $('error').style.display = 'block'; }
</script>
</body>
</html>
